{% extends "base.html" %}

{% block title %}Set New Password - ClinicConnect AI{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h2>Set New Password</h2>
            <p>Create a new password for administrator <strong>{{ user.username }}</strong>{% if user.business %} (<em>{{ user.business.name }}</em>){% endif %}.</p>
        </div>

        <form method="POST" action="" class="login-form">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="password-field-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" title="Show password">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="password-field-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)" aria-label="Show password" title="Show password">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Save New Password &amp; Sign In</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="/admin/login" style="color: #4f46e5; text-decoration: none; font-size: 0.88rem; font-weight: 600;">
                ← Cancel and Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
