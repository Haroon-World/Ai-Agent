{% extends "base.html" %}

{% block title %}Admin Login - SmileCare AI Business Agent{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔒</div>
            <h2>Admin Portal Login</h2>
            <p>Access the clinic dashboard, live conversations, and appointments.</p>
        </div>

        <form method="POST" action="/admin/login" class="login-form">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. admin" value="admin" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="e.g. admin123" value="admin123" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>
        </form>

        <div class="login-footer-hint">
            <small>Demo Credentials: <code>admin</code> / <code>admin123</code> (configured in <code>.env</code>)</small>
        </div>
    </div>
</div>
{% endblock %}
